<a class="k-skip" href="#content">Skip to content</a>
<header class="k-header">
  <div class="k-wrap k-header__in">
    <a class="k-brand" href="{{ "/" | relURL }}"><img src="{{ "images/kit/logo-circle.png" | relURL }}" alt="" width="44" height="44"><span>EDRLab members</span></a>
    <button class="k-burger" type="button" aria-expanded="false" aria-controls="k-nav">Menu</button>
    <nav class="k-nav" id="k-nav" aria-label="Main">
      <ul>
      {{- $page := . }}
      {{- range site.Menus.main }}
        {{- if not (eq .Identifier "edrlaborg") }}
        <li><a href="{{ .URL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      {{- end }}
      </ul>
      {{- range where site.Menus.main "Identifier" "edrlaborg" }}
      <a class="k-ext" href="{{ .URL }}">{{ .Name }} {{ partial "kit/icon.html" "arrow-up-right" }}</a>
      {{- end }}
    </nav>
  </div>
</header>
<script>
(function(){var b=document.querySelector('.k-burger'),n=document.getElementById('k-nav');if(!b||!n)return;
b.addEventListener('click',function(){var o=n.classList.toggle('is-open');b.setAttribute('aria-expanded',o);});})();
</script>
