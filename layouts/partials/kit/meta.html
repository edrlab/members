{{- $desc := .Params.description | default .Params.summary | default site.Params.description | default "EDRLab members: publishers, distributors, booksellers, libraries and developers working on open digital reading." }}
{{- $img := .Params.og_image | default "images/kit/og.png" | absURL }}
<meta name="description" content="{{ $desc | plainify | truncate 200 }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EDRLab members">
<meta property="og:title" content="{{ if .IsHome }}EDRLab members{{ else }}{{ .Title }} | EDRLab members{{ end }}">
<meta property="og:description" content="{{ $desc | plainify | truncate 200 }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ $img }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
