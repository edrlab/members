<footer class="k-footer">

    <ul class="k-social">
      {{- range site.Data.social }}
      <li><a href="{{ .url }}" aria-label="{{ .name }}">{{ partial "kit/icon.html" .icon }}</a></li>
      {{- end }}
    </ul>
  </div>
</footer>
<script src="{{ "js/edrlab.js" | relURL }}" defer></script>
